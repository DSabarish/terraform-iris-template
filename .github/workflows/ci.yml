name: Iris ML — CI and Pipeline

on:
  push:
    branches: [ dev-branch-iris ]
  pull_request:
    branches: [ dev-branch-iris ]

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v

  pipeline:
    name: Run GCP training pipeline
    needs: test
    if: github.ref == 'refs/heads/dev-branch-iris'
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-sa-key.json

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write GCP service account key
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > gcp-sa-key.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full Iris pipeline
        run: |
          python src/pipeline.py \
            --project_id "$GCP_PROJECT" \
            --dataset_id "iris_dataset" \
            --table_id "iris_raw" \
            --gcs_bucket "$GCS_BUCKET"

