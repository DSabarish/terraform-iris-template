name: Iris ML — CI and Pipeline

on:
  push:
    branches: [ dev-branch-iris ]
  pull_request:
    branches: [ dev-branch-iris ]

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set PYTHONPATH to repo root
        run: echo "PYTHONPATH=$PYTHONPATH:${{ github.workspace }}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (unit tests only)
        run: pytest tests/test_core_pipeline.py tests/test_pipeline.py -v

  pipeline:
    name: Run GCP training pipeline
    needs: test
    if: github.ref == 'refs/heads/dev-branch-iris'
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-sa-key.json

    steps:
      - uses: actions/checkout@v4

      - name: Set PYTHONPATH to repo root
        run: echo "PYTHONPATH=$PYTHONPATH:${{ github.workspace }}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write GCP service account key
        run: echo '${{ secrets.GCP_SA_KEY }}' > gcp-sa-key.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full Iris pipeline
        id: pipeline
        run: |
          python src/pipeline.py \
            --project_id "$GCP_PROJECT" \
            --dataset_id "iris_dataset" \
            --table_id "iris_raw" \
            --gcs_bucket "$GCS_BUCKET"
        env:
          GIT_COMMIT_SHA: ${{ github.sha }}

  build_image:
    name: Build Docker image
    needs: pipeline
    if: github.ref == 'refs/heads/dev-branch-iris'
    runs-on: ubuntu-latest
    outputs:
      image_uri_b64: ${{ steps.build.outputs.image_uri_b64 }}
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      REPO_NAME: iris-ml
      IMAGE_NAME: iris-ml-api
      REGION: us-central1

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        id: build
        run: |
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_URI="${REGION}-docker.pkg.dev/${GCP_PROJECT}/${REPO_NAME}/${IMAGE_NAME}:${SHA_SHORT}"
          LATEST_URI="${REGION}-docker.pkg.dev/${GCP_PROJECT}/${REPO_NAME}/${IMAGE_NAME}:latest"

          docker build -t $IMAGE_URI -t $LATEST_URI .
          docker push $IMAGE_URI
          docker push $LATEST_URI

          IMAGE_URI_B64=$(echo -n "$IMAGE_URI" | base64 -w 0)
          echo "image_uri_b64=$IMAGE_URI_B64" >> $GITHUB_OUTPUT

  register_and_deploy:
    name: Register Model & Deploy
    needs: [pipeline, build_image]
    if: github.ref == 'refs/heads/dev-branch-iris'
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
      SERVICE_NAME: iris-ml-api
      REGION: us-central1
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-sa-key.json

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Decode IMAGE_URI
        env:
          IMAGE_URI_B64: ${{ needs.build_image.outputs.image_uri_b64 }}
        run: |
          if [ -z "$IMAGE_URI_B64" ]; then
            echo "ERROR: IMAGE_URI_B64 is empty."
            exit 1
          fi
          IMAGE_URI=$(echo -n "$IMAGE_URI_B64" | base64 -d)
          echo "Decoded IMAGE_URI: $IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Set PYTHONPATH to repo root
        run: echo "PYTHONPATH=$PYTHONPATH:${{ github.workspace }}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write GCP service account key
        run: echo '${{ secrets.GCP_SA_KEY }}' > gcp-sa-key.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Register model in Vertex AI Model Registry
        id: register_model
        run: |
          MODEL_URI="gs://${{ secrets.GCS_BUCKET }}/artifacts/models/${{ github.sha }}/model.pkl"
          SCALER_URI="gs://${{ secrets.GCS_BUCKET }}/artifacts/scalers/scaler.pkl"
          MODEL_DISPLAY_NAME="iris-classifier-${{ github.sha }}"

          echo "Using REGION:    $REGION"
          echo "Using IMAGE_URI: $IMAGE_URI"

          MODEL_RESOURCE=$(python scripts/register_model_vertex.py \
            --project_id "$GCP_PROJECT" \
            --region "$REGION" \
            --model_gcs_uri "$MODEL_URI" \
            --scaler_gcs_uri "$SCALER_URI" \
            --display_name "$MODEL_DISPLAY_NAME" \
            --serving_container_image_uri "$IMAGE_URI" \
            --description "Iris classifier from commit ${{ github.sha }}" 2>&1 1>/tmp/model_resource.txt)

          MODEL_RESOURCE=$(cat /tmp/model_resource.txt | tail -1)
          echo "Model registered: $MODEL_RESOURCE"
          echo "MODEL_RESOURCE_NAME=$MODEL_RESOURCE" >> $GITHUB_ENV
          echo "MODEL_DISPLAY_NAME=$MODEL_DISPLAY_NAME" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          python scripts/deploy_cloud_run_vertex.py \
            --project_id "$GCP_PROJECT" \
            --region "$REGION" \
            --service_name "$SERVICE_NAME" \
            --image_uri "$IMAGE_URI" \
            --model_display_name "$MODEL_DISPLAY_NAME" \
            --gcs_bucket "$GCS_BUCKET" \
            --service_account "${{ secrets.CLOUD_RUN_SA_EMAIL }}"

  promote_to_qa:
    name: Promote to QA branch
    needs: register_and_deploy
    if: github.ref == 'refs/heads/dev-branch-iris'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # fetch full history so we can push to other branches
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push to qa-branch-iris
        run: |
          git fetch origin
          # Create qa-branch-iris from dev-branch-iris if it doesn't exist
          git checkout -B qa-branch-iris origin/dev-branch-iris 2>/dev/null || \
            git checkout -B qa-branch-iris
          git push origin qa-branch-iris --force-with-lease
          echo "Successfully promoted commit ${{ github.sha }} to qa-branch-iris"