name: Iris ML — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGION: us-central1
  IMAGE_NAME: iris-ml-api

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. Lint + Unit Tests
  # ────────────────────────────────────────────────────────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint (ruff)
        run: ruff check src/

      - name: Run unit tests
        run: pytest tests/ -v

  # ────────────────────────────────────────────────────────────
  # 2. Terraform validate
  # ────────────────────────────────────────────────────────────
  tf_validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform fmt check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init (dev)
        run: |
          terraform -chdir=terraform init \
            -backend-config=envs/dev/backend.conf \
            -reconfigure
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY_DEV }}

      - name: Terraform validate
        run: terraform -chdir=terraform validate

  # ────────────────────────────────────────────────────────────
  # 3. Dev deployment
  # ────────────────────────────────────────────────────────────
  deploy_dev:
    name: Deploy → Dev
    needs: [test, tf_validate]
    runs-on: ubuntu-latest
    environment: dev
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT_DEV }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_DEV }}
      GCS_BUCKET: ${{ secrets.GCS_BUCKET_DEV }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_DEV }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Plan (dev)
        run: |
          terraform -chdir=terraform init -backend-config=envs/dev/backend.conf -reconfigure
          terraform -chdir=terraform plan \
            -var-file=envs/dev/terraform.tfvars \
            -out=tfplan_dev

      - name: Terraform Apply (dev)
        run: terraform -chdir=terraform apply tfplan_dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Ingest Data to BigQuery
        run: |
          python src/bq_ingestion.py \
            --project_id $GCP_PROJECT \
            --dataset_id iris_dev \
            --table_id iris_raw

      - name: Export BQ → GCS
        run: |
          python src/load_data_from_bq.py \
            --project_id $GCP_PROJECT \
            --dataset_id iris_dev \
            --table_id iris_raw \
            --gcs_bucket $GCS_BUCKET

      - name: Clean data
        run: |
          python src/clean_raw_data.py \
            --project_id $GCP_PROJECT \
            --gcs_bucket $GCS_BUCKET

      - name: Transform data
        run: |
          python src/transform_data.py \
            --project_id $GCP_PROJECT \
            --gcs_bucket $GCS_BUCKET

      - name: Train model
        env:
          GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          python src/train.py \
            --project_id $GCP_PROJECT \
            --gcs_bucket $GCS_BUCKET

      - name: Build & push Docker image
        run: |
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          REPO="${{ env.REGION }}-docker.pkg.dev/$GCP_PROJECT/iris-ml-dev"
          IMAGE_URI="$REPO/${{ env.IMAGE_NAME }}:$SHA_SHORT"

          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Deploy to Cloud Run (dev)
        run: |
          gcloud run deploy iris-ml-api-dev \
            --image $IMAGE_URI \
            --region ${{ env.REGION }} \
            --project $GCP_PROJECT \
            --quiet

      - name: Integration tests (dev)
        run: |
          SERVICE_URL=$(gcloud run services describe iris-ml-api-dev \
            --region ${{ env.REGION }} \
            --project $GCP_PROJECT \
            --format 'value(status.url)')
          pytest tests/integration/ -v --base-url=$SERVICE_URL

  # ────────────────────────────────────────────────────────────
  # 4. Manual approval + QA
  # ────────────────────────────────────────────────────────────
  deploy_qa:
    name: Deploy → QA
    needs: deploy_dev
    runs-on: ubuntu-latest
    environment: qa   # Requires manual approval in GitHub Environments settings
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT_QA }}
      GCS_BUCKET: ${{ secrets.GCS_BUCKET_QA }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_QA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Plan & Apply (QA)
        run: |
          terraform -chdir=terraform init -backend-config=envs/qa/backend.conf -reconfigure
          terraform -chdir=terraform apply -auto-approve \
            -var-file=envs/qa/terraform.tfvars

      - name: Promote image to QA registry
        run: |
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          DEV_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_DEV }}/iris-ml-dev/${{ env.IMAGE_NAME }}:$SHA_SHORT"
          QA_IMAGE="${{ env.REGION }}-docker.pkg.dev/$GCP_PROJECT/iris-ml-qa/${{ env.IMAGE_NAME }}:$SHA_SHORT"

          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          docker pull $DEV_IMAGE
          docker tag $DEV_IMAGE $QA_IMAGE
          docker push $QA_IMAGE

          echo "IMAGE_URI=$QA_IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run (QA)
        run: |
          gcloud run deploy iris-ml-api-qa \
            --image $IMAGE_URI \
            --region ${{ env.REGION }} \
            --project $GCP_PROJECT \
            --quiet

      - name: QA validation tests
        run: |
          SERVICE_URL=$(gcloud run services describe iris-ml-api-qa \
            --region ${{ env.REGION }} \
            --project $GCP_PROJECT \
            --format 'value(status.url)')
          pytest tests/integration/ -v --base-url=$SERVICE_URL

  # ────────────────────────────────────────────────────────────
  # 5. Manual approval + Prod
  # ────────────────────────────────────────────────────────────
  deploy_prod:
    name: Deploy → Prod
    needs: deploy_qa
    runs-on: ubuntu-latest
    environment: prod   # Senior approval required
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT_PROD }}
      GCS_BUCKET: ${{ secrets.GCS_BUCKET_PROD }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_PROD }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Plan & Apply (Prod)
        run: |
          terraform -chdir=terraform init -backend-config=envs/prod/backend.conf -reconfigure
          terraform -chdir=terraform apply -auto-approve \
            -var-file=envs/prod/terraform.tfvars

      - name: Promote image to Prod registry
        run: |
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          QA_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_QA }}/iris-ml-qa/${{ env.IMAGE_NAME }}:$SHA_SHORT"
          PROD_IMAGE="${{ env.REGION }}-docker.pkg.dev/$GCP_PROJECT/iris-ml-prod/${{ env.IMAGE_NAME }}:$SHA_SHORT"

          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          docker pull $QA_IMAGE
          docker tag $QA_IMAGE $PROD_IMAGE
          docker push $PROD_IMAGE

          echo "IMAGE_URI=$PROD_IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run (Prod)
        run: |
          gcloud run deploy iris-ml-api-prod \
            --image $IMAGE_URI \
            --region ${{ env.REGION }} \
            --project $GCP_PROJECT \
            --quiet

      - name: Smoke test Prod
        run: |
          SERVICE_URL=$(gcloud run services describe iris-ml-api-prod \
            --region ${{ env.REGION }} \
            --project $GCP_PROJECT \
            --format 'value(status.url)')
          python -c "
          import urllib.request, json, sys
          url = '$SERVICE_URL/predict'
          data = json.dumps({'sepal_length':5.1,'sepal_width':3.5,'petal_length':1.4,'petal_width':0.2}).encode()
          req = urllib.request.Request(url, data=data, headers={'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(req) as r:
              result = json.loads(r.read())
              assert result['class_name'] in ['setosa','versicolor','virginica'], f'Bad result: {result}'
              print('Smoke test passed:', result)
          "
